[package]
name = "soundglass"
version = "0.1.0"
edition = "2024"
description = "A small, fast audio player and quick editor"
license = "GPL-3.0-or-later"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
symphonia = { version = "0.6.1", features = ["all"] }

# Unoptimised decoders are 10–50× slower; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3
