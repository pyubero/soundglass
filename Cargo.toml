[package]
name = "soundglass"
version = "0.1.0"
edition = "2024"
description = "A small, fast audio player and quick editor"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.23.1"
bpm-key = { version = "0.1.0", default-features = false }
cpal = "0.18.2"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "persistence"] }
flacenc = "0.5.1"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
# Already in the build (winit); keeps the NVIDIA libraries loaded for ONNX Runtime's CUDA provider.
libloading = "0.8"
lofty = "0.25.5"
mp3lame-encoder = "0.3.0"
# ONNX Runtime itself is loaded at run time from the copy Local AI → Download AI Runtime… installs.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31", "cuda"] }
percent-encoding = "2.3"
rfd = "0.18.0"
realfft = "3.5.1"
ron = "0.12"
rubato = "5.0.1"
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = "3.5.2"
vorbis_rs = "0.5.6"
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
# Already in the dependency tree (winit); only for SetDllDirectoryW (GPU support).
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

# Unoptimised decoders are 10–50× slower; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
# Embeds icon/soundglass.ico in the Windows .exe; does nothing on other targets.
winresource = "0.1.34"
